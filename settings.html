<div class="st-local-statusbar-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>本地状态栏</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label" for="st_local_statusbar_enabled">
        <input id="st_local_statusbar_enabled" type="checkbox" />
        <span>启用本地状态栏</span>
      </label>
      <label class="checkbox_label" for="st_local_cot_enabled">
        <input id="st_local_cot_enabled" type="checkbox" />
        <span>启用Cot美化</span>
      </label>
      <label class="checkbox_label" for="st_local_narrative_indent">
        <input id="st_local_narrative_indent" type="checkbox" />
        <span>启用正文排版</span>
      </label>
      <label class="st-local-statusbar-setting-row" for="st_narrative_indent">
        <span>首行缩进</span><select id="st_narrative_indent"><option value="0">不缩进</option><option value="1">1 字符</option><option value="2">2 字符</option></select>
      </label>
      <label class="st-local-statusbar-setting-row" for="st_narrative_gap">
        <span>段间距 <output id="st_narrative_gap_value" for="st_narrative_gap">0.33 行</output></span><input id="st_narrative_gap" type="range" min="0" max="1" step="0.01" />
      </label>
      <label class="st-local-statusbar-setting-row" for="st_narrative_line">
        <span>正文行距</span><select id="st_narrative_line"><option value="0">跟随主题 / 字体设置</option><option value="1.2">1.2 倍</option><option value="1.4">1.4 倍</option><option value="1.6">1.6 倍</option><option value="1.8">1.8 倍</option><option value="2">2.0 倍</option><option value="2.2">2.2 倍</option><option value="2.4">2.4 倍</option></select>
      </label>
      <button id="st_narrative_reset" type="button" class="menu_button">恢复默认排版</button>
      <small class="notes">调整后即时预览并保存。默认：缩进 2 字符，段距约三分之一行，行距跟随主题。仅作用于 CoT 后、状态栏前的正文；关闭恢复原排版。</small>
      <label class="checkbox_label" for="st_local_statusbar_auto_expand">
        <input id="st_local_statusbar_auto_expand" type="checkbox" />
        <span>自动展开状态栏</span>
      </label>
      <label class="st-local-statusbar-setting-row" for="st_local_statusbar_width">
        <span>面板宽度(%)</span>
        <input id="st_local_statusbar_width" type="range" min="40" max="100" />
      </label>
      <label class="st-local-statusbar-setting-row" for="st_local_statusbar_text_scale">
        <span>文本大小(%)</span>
        <input id="st_local_statusbar_text_scale" type="range" min="75" max="120" />
      </label>
      <label class="st-local-statusbar-setting-row" for="st_local_statusbar_text_weight">
        <span>文本粗细</span>
        <input id="st_local_statusbar_text_weight" type="range" min="300" max="700" step="50" />
      </label>
      <div class="st-local-statusbar-setting-row">
        <span>文本对齐</span>
        <select id="st_local_statusbar_text_align">
          <option value="right">右对齐</option>
          <option value="left">左对齐</option>
        </select>
      </div>
      <input id="st_local_statusbar_reload" class="menu_button" type="button" value="重载状态栏" />
      <small class="notes">
        当前扩展完全本地加载，状态栏会出现在原本脚本追加到页面的位置。
      </small>
    </div>
  </div>
</div>
